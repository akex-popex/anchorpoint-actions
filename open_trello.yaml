version: 1.0
action:
  name: Open Trello
  id: ap::open::trello
  type: python
  enable: true
  description: Opens the Trello board in the default browser.
  icon:
    path: ":/icons/user-interface/calendar.svg"
  script: "open_trello.py"

  inputs:
    url: "https://trello.com/b/k08vYmqH"

  register:
    sidebar:
      enable: true
